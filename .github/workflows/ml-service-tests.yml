name: ml_service tests

on:
  push:
    paths: ["ml_service/**", ".github/workflows/ml-service-tests.yml"]
  pull_request:
    paths: ["ml_service/**", ".github/workflows/ml-service-tests.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml_service/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pytest -q
